; Configuration for the hid.dll shim.
;
; This sits underneath DirectInput rather than above it. DirectInput loads
; hid.dll by bare name at runtime, so a copy in the application directory is
; found first, and every HID device it looks at passes through here before it
; reaches the report descriptor parsing.
;
; Nothing outside the target process is affected. The keyboard keeps working
; normally everywhere else, and there is nothing to restore afterwards.
;
; Changing anything here takes effect the next time the target starts.

[Filter]

; Master switch. Set to 0 to forward everything untouched, which turns this
; into a pure logger for seeing exactly which HID devices DirectInput opens.
Enabled=1

; The only devices the target is allowed to see, as VID:PID in hexadecimal,
; separated by commas. A bare vendor id covers every product from that vendor.
; Everything not named here is hidden.
;
;   AllowDevices=046D:C216     a Logitech F310 gamepad
;   AllowDevices=046D:C216,045E:028E    two gamepads
;
; Empty is the default and is safe rather than unconfigured: every HID device
; is hidden, which cannot crash, but no gamepad will work until you name one.
;
; To set this up on your own hardware, run Show-HidDevices.ps1, find your
; gamepad, and put its VID:PID here. Prefer the full VID:PID over a bare
; vendor id, since the company that made your gamepad may also have made a
; keyboard you want hidden.
;
; Nothing here is required for the keyboard or mouse. DirectInput supplies
; those from its system keyboard and mouse objects, which do not come through
; this enumeration at all.
;
; There is deliberately no block list. A rule can only name a vendor id, and a
; virtual HID bus such as the one iCUE installs does not have one, so no block
; list can hide it. An allow list also asks the easier question: which device
; do you want, rather than which device is at fault.
AllowDevices=

[Log]

; Writes to %LOCALAPPDATA%\hidshim\hid-shim.log by default.
;
; This log is also the proof that the shim is loaded at all. If the target
; starts and this file is never written, the loader did not pick up this copy
; of hid.dll and nothing here is taking effect.
Enabled=1

; Optional. An absolute path to write the log to instead of the default.
; Useful when one machine runs more than one shimmed application and you want
; their logs kept apart. The directory must already exist.
;
;   Path=C:\Users\you\AppData\Local\nbalive2005\logs\hid-shim.log
Path=
